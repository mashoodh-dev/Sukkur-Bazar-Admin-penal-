<script>
const SB_URL='https://xltyakylnntzlxhcggil.supabase.co';
const SB_KEY='sb_publishable_obLweb6F_j_8Q_tpTjWZpQ_PJG3Tt1I';
const ADMIN_URL='https://sukkurbazaradmin.netlify.app/';
const SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});

// Always send Google OAuth back to the live Admin Panel. Never use live development host.
function getOAuthRedirect(){ return ADMIN_URL; }

async function finishOAuthCallback(){
  try{
    // Admin login uses Google Identity Services + Supabase ID-token sign-in.
    const {data,error}=await SB.auth.getSession();
    if(error) throw error;
    return data?.session||null;
  }catch(e){
    console.warn('Admin session check',e);
    return null;
  }
}

let dbReady=false, dbUser=null;

async function verifyAdminUser(user){
  if(!user?.id) return false;
  try{
    let data=null,error=null;
    for(let attempt=0;attempt<3;attempt++){
      const r=await SB.from('profiles').select('role').eq('id',user.id).maybeSingle();
      data=r.data; error=r.error;
      if(error || data) break;
      await new Promise(resolve=>setTimeout(resolve,500));
    }
    if(error) throw error;
    if(data?.role!=='admin'){
      await SB.auth.signOut();
      toast('This Google account is not an Admin account.');
      return false;
    }
    dbUser=user;
    dbReady=true;
    return true;
  }catch(e){
    console.warn('Admin verification',e);
    await SB.auth.signOut().catch(()=>{});
    toast('Admin verification failed. Check the profiles table.');
    return false;
  }
}

async function enterAdminSession(session){
  const user=session?.user;
  if(!user || !(await verifyAdminUser(user))){
    state.auth=false;
    document.getElementById('app')?.classList.add('hidden');
    document.getElementById('auth')?.classList.remove('hidden');
    authMode();
    return false;
  }
  state.auth=true;
  state.page='dashboard';
  state.history=[];
  document.getElementById('auth')?.classList.add('hidden');
  document.getElementById('app')?.classList.remove('hidden');
  try{ await dbLoadAll(); save(); render(); }catch(e){ console.warn('Initial database load',e); render(); }
  return true;
}

SB.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN' && session){
    setTimeout(()=>enterAdminSession(session),0);
  }
  if(event==='SIGNED_OUT'){
    state.auth=false;
    dbUser=null; dbReady=false;
    document.getElementById('app')?.classList.add('hidden');
    document.getElementById('auth')?.classList.remove('hidden');
    authMode();
  }
});

async function dbBoot(){
  const session=await finishOAuthCallback();
  if(!session) return false;
  return await enterAdminSession(session);
}

async function dbRequireAdmin(){
  if(!dbUser){ const ok=await dbBoot(); if(!ok) return false; }
  return await verifyAdminUser(dbUser);
}

let state=JSON.parse(JSON.stringify(seed));
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)state={...state,...x};if(!Array.isArray(state.deals))state.deals=seed.deals.map(x=>({...x}));if(!Array.isArray(state.categories))state.categories=seed.categories.map(x=>({...x}))}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(x){return 'Rs. '+Number(x||0).toLocaleString('en-PK')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',2200)}
function authMode(){

}
const GOOGLE_CLIENT_ID='45077632541-3ge0j47jf4tf8b4963hvn1tv3un60ofr.apps.googleusercontent.com';
// Existing Google OAuth callback used by the Shopping/Seller apps. It is NOT changed.

const SHARED_GOOGLE_CALLBACK='https://xltyakylnntzlxhcggil.supabase.co/auth/v1/callback';

let googleAdminReady=false;
function initGoogleAdmin(){
  if(!window.google?.accounts?.id){
    toast('Google Sign-In is still loading. Please try again.');
    return;
  }
  try{
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID,
      callback:async(response)=>{
        try{
          if(!response?.credential) throw new Error('Google did not return an ID token.');
          const {data,error}=await SB.auth.signInWithIdToken({
            provider:'google',
            token:response.credential
          });
          if(error) throw error;
          if(data?.session){
            await enterAdminSession(data.session);
          }else{
            throw new Error('Supabase did not create an Admin session.');
          }
        }catch(e){
          console.error('Admin Google sign-in failed:',e);
          toast(e?.message||'Google sign-in failed');
        }
      },
      auto_select:false,
      cancel_on_tap_outside:true,
      use_fedcm_for_prompt:true
    });
    googleAdminReady=true;
    const host=document.getElementById('googleButton');
    if(host){
      host.innerHTML='';
      google.accounts.id.renderButton(host,{
        type:'standard',
        theme:'outline',
        size:'large',
        text:'continue_with',
        shape:'rectangular',
        width:360
      });
    }
  }catch(e){
    console.error('Google Identity Services init failed:',e);
    toast('Google Sign-In could not be initialized.');
  }
}
function googleAdmin(){
  if(!googleAdminReady) initGoogleAdmin();
  else google.accounts.id.prompt();
}

const tabs=[['dashboard','⌂','Home'],['sellers','🏪','Sellers'],['products','📦','Products'],['orders','🛒','Orders'],['more','☰','More']];
function render(){document.getElementById('brandName').textContent=(state.market.name||'SUKKUR BAZAR').toUpperCase();document.getElementById('topBack').classList.toggle('hidden',state.history.length===0||state.page==='dashboard');document.getElementById('bottom').innerHTML=tabs.map(x=>`<button class="${(state.page===x[0]||(x[0]==='more'&&['earnings','customers','categories','support','notifications','ads','deals','delivery','market','settings'].includes(state.page)))?'on':''}" onclick="${x[0]==='more'?'openMore()':`go('${x[0]}')`}"><b>${x[1]}</b>${x[2]}</button>`).join('');let fn=window[state.page]||dashboard;document.getElementById('main').innerHTML=fn()}
function go(p,push=true){if(p===state.page)return;if(push)state.history.push(state.page);state.page=p;save();render();window.scrollTo(0,0)}function goBack(){let p=state.history.pop()||'dashboard';state.page=p;save();render();window.scrollTo(0,0)}
function head(t,s){return `<div class="head">${state.history.length?'<button class="back" onclick="goBack()">←</button>':''}<div><h1>${t}</h1>${s?`<div class="muted" style="font-size:12px;margin-top:4px">${s}</div>`:''}</div></div>`}function badge(x){let c=/active|delivered|resolved/i.test(x)?'green':/pending|new|processing/i.test(x)?'yellow':/hidden|blocked|suspend|cancel/i.test(x)?'red':'';return `<span class="badge ${c}">${esc(x)}</span>`}
function dashboard(){let low=state.products.filter(x=>x.stock<=5).length,newOrders=state.orders.filter(x=>x.status==='New').length,totalSales=state.orders.filter(x=>x.status!=='Cancelled').reduce((a,x)=>a+Number(x.total||0),0),completedSales=state.orders.filter(x=>x.status==='Delivered'||x.status==='Completed').reduce((a,x)=>a+Number(x.total||0),0);return head('Dashboard','Tap any card to open its complete section')+`<div class="grid"><button class="stat" onclick="go('earnings')">💰<span>Total Marketplace Sales</span><b>${money(totalSales)}</b><small class="muted">Tap for sales details</small></button><button class="stat" onclick="go('sellers')">🏪<span>Total Sellers</span><b>${state.sellers.length}</b></button><button class="stat" onclick="go('products')">📦<span>Total Products</span><b>${state.products.length}</b></button><button class="stat" onclick="go('orders')">🛒<span>Total Orders</span><b>${state.orders.length}</b></button><button class="stat" onclick="go('customers')">👥<span>Total Customers</span><b>${state.customers.length}</b></button></div><div class="card"><h2>Quick Overview</h2><button class="listbtn" onclick="go('earnings')"><span>💰 Completed Sales</span><b>${money(completedSales)}</b></button><button class="listbtn" onclick="go('orders')"><span>🛒 New Orders</span><b>${newOrders}</b></button><button class="listbtn" onclick="go('products')"><span>⚠️ Low Stock Products</span><b>${low}</b></button><button class="listbtn" onclick="go('sellers')"><span>🏪 Pending Sellers</span><b>${state.sellers.filter(x=>x.status==='Pending').length}</b></button><button class="listbtn" onclick="go('support')"><span>💬 Open Support Requests</span><b>${state.complaints.filter(x=>x.status!=='Resolved').length}</b></button></div>`}
function tablePage(title,subtitle,page,cols){let arr=state[page];return head(title,subtitle)+`<div class="filters"><input class="input" placeholder="Search ${title.toLowerCase()}..." oninput="filterRows(this.value)"></div><div class="card table"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}<th>Action</th></tr></thead><tbody id="rows">${arr.map((x,i)=>`<tr>${rowCells(page,x)}<td><button class="btn out" onclick="viewItem('${page}',${i})">View</button></td></tr>`).join('')}</tbody></table></div>`}

function rowCells(p,x){if(p==='sellers')return `<td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.shop)}</td><td>${esc(x.category)}</td><td>${badge(x.status)}</td>`;if(p==='products')return `<td>${esc(x.name)}</td><td>${esc(x.shop)}</td><td>${esc(x.category)}</td><td>${money(x.price)}</td><td>${esc(x.stock)}</td><td>${badge(x.status)}</td>`;if(p==='orders')return `<td>${esc(x.id)}</td><td>${esc(x.customer)}</td><td>${esc(x.shop)}</td><td>${money(x.total)}</td><td>${esc(x.delivery)}</td><td>${badge(x.status)}</td>`;let spend=state.orders.filter(o=>o.customer===x.name||o.phone===x.phone).filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+Number(o.total||0),0);return `<td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.orders)}</td><td>${badge(x.status)}</td>`}
function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function categories(){return head('Categories','Manage category name, icon and gallery picture')+`<div class="card"><button class="btn" onclick="addCategory()">＋ Add Category</button></div><div class="card">${state.categories.map((x,i)=>`<div class="category-row"><div class="category-info">${x.image?`<img class="category-img" src="${x.image}" alt="">`:`<div class="category-icon">${esc(x.icon||'🛍️')}</div>`}<b>${esc(x.name)}</b></div><div class="category-actions"><button class="btn out" onclick="editCategory(${i})">Edit</button><button class="btn red" onclick="deleteCategory(${i})">Delete</button></div></div>`).join('')||'<div class="empty">No categories yet.</div>'}</div>`}
function support(){return head('Support / Complaints','Customer support requests')+`<div class="card">${state.complaints.map((x,i)=>`<div class="listbtn"><span><b>${esc(x.subject)}</b><br><small class="muted">${esc(x.name)} · ${esc(x.message)}</small></span><span>${badge(x.status)} <button class="btn out" onclick="resolveComplaint(${i})">Update</button></span></div>`).join('')||'<div class="empty">No support requests</div>'}</div>`}
function notifications(){state.notifications.forEach(x=>x.read=true);save();return head('Notifications','Admin alerts')+`<div class="card">${state.notifications.map(x=>`<div class="listbtn"><span><b>${esc(x.title)}</b><br><small class="muted">${esc(x.text)}</small></span><small>${esc(x.time)}</small></div>`).join('')||'<div class="empty">No notifications</div>'}</div>`}
function ads(){return head('Paid Banners & Advertisements','Only Admin can add and manage paid promotions')+`<div class="card"><p class="muted">Businesses or sellers who pay for promotion can have their advertisement uploaded here by Admin.</p><button class="btn gold" onclick="addAd()">＋ Add Paid Advertisement</button></div><div class="card">${state.ads.length?state.ads.map((x,i)=>`<div class="listbtn"><span>${x.image?`<img src="${x.image}" style="width:55px;height:38px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">`:''}<b>${esc(x.title)}</b><br><small class="muted">${esc(x.business)} · ${esc(x.start)} to ${esc(x.end)}</small></span><button class="btn out" onclick="toggleAd(${i})">${x.active?'Active':'Inactive'}</button></div>`).join(''):'<div class="empty">No paid advertisements yet</div>'}</div>`}
function deals(){return head('Deals & Offers','Manage all 4 Shopping App offer cards from Admin Panel')+`<div class="card"><p class="muted">These 4 Shopping App offer cards are controlled by Admin. They are synced locally for the Shopping App; connect the same Supabase marketplace_settings/deals data when the Shopping App reads from the database.</p></div><div class="card">${state.deals.map((x,i)=>`<div class="listbtn"><span><b>${esc(x.title)}</b><br><small class="muted">${esc(x.subtitle)} · ${esc(x.category)}</small></span><button class="btn out" onclick="editDeal(${i})">Manage</button></div>`).join('')}</div>`}function editDeal(i){let x=state.deals[i];if(!x)return;simpleForm('Edit Offer Card',[['Offer Heading','title',x.title],['Offer Description','subtitle',x.subtitle],['Category','category',x.category]],o=>{x.title=o.title||x.title;x.subtitle=o.subtitle||x.subtitle;x.category=o.category||x.category;save();syncDealsToShopping();go('deals',false);toast('Offer card updated')})}function syncDealsToShopping(){try{let k='sukkur_bazar_admin_settings_v1',x=JSON.parse(localStorage.getItem(k)||'{}');x.deals=state.deals.filter(d=>d.active!==false).map(d=>({title:d.title,subtitle:d.subtitle,category:d.category}));localStorage.setItem(k,JSON.stringify(x))}catch(e){}}function delivery(){return head('Seller–Admin Delivery Arrangement','Internal arrangement between Seller and Admin — not a customer payment setting')+`<div class="card"><button class="btn" onclick="addDelivery()">＋ Add Arrangement</button></div><div class="card">${state.delivery.map((x,i)=>`<div class="listbtn"><span><b>${esc(x.seller)}</b><br><small class="muted">${esc(x.type)} · ${esc(x.note)}</small></span><span>${badge(x.status)} <button class="btn out" onclick="editDelivery(${i})">Edit</button></span></div>`).join('')}</div>`}
function market(){return head('Marketplace Profile & Branding','Future-ready central branding for Shopping and Seller apps')+`<div class="card"><div class="row"><div><label>Marketplace / App Name</label><input id="m_name" class="input" value="${esc(state.market.name)}"></div><div><label>Tagline</label><input id="m_tag" class="input" value="${esc(state.market.tagline)}"></div><div><label>Support Phone</label><input id="m_phone" class="input" value="${esc(state.market.supportPhone)}"></div><div><label>Support WhatsApp</label><input id="m_wa" class="input" value="${esc(state.market.supportWhatsapp)}"></div></div><br><label>Business Address</label><textarea id="m_addr" class="input">${esc(state.market.address)}</textarea><br><br><label>Marketplace Logo</label><input type="file" accept="image/*" onchange="readImage(this,'marketPreview')"><div id="marketPreview">${state.market.logo?`<img class="preview" src="${state.market.logo}">`:'<small class="muted">No logo uploaded</small>'}</div><br><button class="btn" onclick="saveMarket()">Save Marketplace Profile</button></div>`}
function settings(){return head('Admin Profile & Settings','Profile, account and security')+`<div class="card"><h2>Admin Profile</h2><div class="row"><div><label>Admin Name</label><input id="a_name" class="input" value="${esc(state.admin.name)}"></div><div><label>Mobile Number</label><input id="a_phone" class="input" value="${esc(state.admin.phone)}"></div></div><br><label>Profile Picture</label><input type="file" accept="image/*" onchange="readImage(this,'adminPreview')"><div id="adminPreview">${state.admin.profile?`<img class="preview" src="${state.admin.profile}">`:''}</div><br><button class="btn" onclick="saveAdminProfile()">Save Profile</button></div><div class="card"><h2>Security</h2><p class="muted">This Admin Panel uses Google sign-in only.</p><button class="btn red" onclick="logout()">Logout</button></div>`}
function openMore(){modal('More Options',`<div>${[['earnings','💰 Marketplace Sales'],['customers','👥 Customers'],['categories','🗂️ Categories'],['support','💬 Support / Complaints'],['notifications','🔔 Notifications'],['ads','📢 Paid Banners & Ads'],['deals','🎯 Deals & Offers'],['delivery','🚚 Delivery Arrangement'],['market','🏷️ Marketplace Profile'],['settings','⚙️ Settings']].map(x=>`<button class="listbtn" onclick="closeModal();go('${x[0]}')">${x[1]} <b>›</b></button>`).join('')}</div>`)}
function modal(title,html){document.getElementById('modalRoot').innerHTML=`<div class="modalroot" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function logout(){modal('Logout?',`<p>Are you sure you want to logout from the Admin Panel?</p><button class="btn out" onclick="closeModal()">Cancel</button> <button class="btn red" onclick="doLogout()">Logout</button>`)}async function doLogout(){try{await SB.auth.signOut()}catch(e){}dbUser=null;dbReady=false;state.auth=false;state.history=[];save();closeModal();document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden');authMode()}
function viewItem(page,i){let x=state[page][i];if(page==='customers'){let os=state.orders.filter(o=>o.customer===x.name||o.phone===x.phone),spend=os.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+Number(o.total||0),0);modal('Customer Account',`<div class="setting"><b>Name</b><span>${esc(x.name)}</span></div><div class="setting"><b>Mobile</b><span>${esc(x.phone)}</span></div><div class="setting"><b>Account Created</b><span>${esc(x.created||'Not available')}</span></div><div class="setting"><b>Total Orders</b><span>${os.length||x.orders||0}</span></div><div class="setting"><b>Total Spending</b><span>${money(spend)}</span></div><div class="setting"><b>Status</b><span>${badge(x.status)}</span></div><h3>Order History</h3>${os.map(o=>`<div class="card"><b>${esc(o.id)}</b><div class="muted">${esc(o.shop)} · ${esc(o.date||'')}</div><div style="margin-top:6px">${money(o.total)} · ${badge(o.status)}</div></div>`).join('')||'<div class="empty">No orders found for this customer.</div>'}<button class="btn ${x.status==='Active'?'red':''}" onclick="toggleCustomer(${i})">${x.status==='Active'?'Suspend / Block Account':'Activate Account'}</button>`);return}modal('Details',`<div>${Object.entries(x).map(([k,v])=>`<div class="setting"><b>${esc(k)}</b><span>${typeof v==='boolean'?(v?'Yes':'No'):esc(v)}</span></div>`).join('')}</div>`)}function toggleCustomer(i){state.customers[i].status=state.customers[i].status==='Active'?'Suspended':'Active';save();closeModal();go('customers',false);toast('Customer account updated')}
let categoryImageDraft='';function categoryImagePick(input){let f=input.files&&input.files[0];if(!f||!f.type.startsWith('image/'))return toast('Please select an image');let r=new FileReader();r.onload=e=>{categoryImageDraft=e.target.result;let p=document.getElementById('categoryImagePreview');if(p)p.innerHTML=`<img class="preview" src="${e.target.result}" alt="Category preview"><br><button type="button" class="btn out" onclick="clearCategoryImage()">Remove Picture</button>`};r.readAsDataURL(f)}function clearCategoryImage(){categoryImageDraft='';let p=document.getElementById('categoryImagePreview');if(p)p.innerHTML='<small class="muted">No picture selected</small>'}function openCategoryForm(title,x,i){categoryImageDraft=x?.image||'';modal(title,`<label>Category Name</label><input id="cat_name" class="input" value="${esc(x?.name||'')}" placeholder="e.g. Grocery" required><br><br><label>Icon / Emoji</label><input id="cat_icon" class="input" value="${esc(x?.icon||'🛍️')}" placeholder="🛍️"><br><br><label>Category Picture (Gallery)</label><input id="cat_file" type="file" accept="image/*" onchange="categoryImagePick(this)"><div id="categoryImagePreview">${categoryImageDraft?`<img class="preview" src="${categoryImageDraft}" alt="Category preview"><br><button type="button" class="btn out" onclick="clearCategoryImage()">Remove Picture</button>`:'<small class="muted">No picture selected</small>'}</div><br><div><button class="btn out" onclick="closeModal()">Cancel</button> <button class="btn" onclick="saveCategory(${i===null?'null':i})">Save Category</button></div>`)}function addCategory(){openCategoryForm('Add Category',{name:'',icon:'🛍️',image:''},null)}function editCategory(i){let x=state.categories[i];if(!x)return toast('Category not found');openCategoryForm('Edit Category',x,i)}async function saveCategory(i){
 let name=document.getElementById('cat_name').value.trim(),icon=document.getElementById('cat_icon').value.trim()||'🛍️';if(!name)return toast('Category name required');
 const file=document.getElementById('cat_file')?.files?.[0];
 try{if(file){categoryImageDraft=await uploadAdminImage(file,'categories')}}catch(e){return toast('Image upload failed: '+e.message)}
 if(i===null){const x={id:'local-'+Date.now(),name,icon,image:categoryImageDraft,active:true,_new:true};state.categories.push(x);const ok=await dbSaveCategory(state.categories.length-1);if(!ok){state.categories.pop();return}}
 else{let x=state.categories[i];if(!x)return toast('Category not found');x.name=name;x.icon=icon;x.image=categoryImageDraft||'';const ok=await dbSaveCategory(i);if(!ok)return}
 save();closeModal();go('categories',false);toast('Category saved ✓')
}
async function deleteCategoryNow(i){const x=state.categories[i];if(x&&!String(x.id).startsWith('local-')){if(!await dbDeleteCategory(x.id))return}state.categories.splice(i,1);save();closeModal();go('categories',false);toast('Category deleted ✓')} function deleteCategory(i){modal('Delete Category',`<p>Remove this category?</p><button class="btn out" onclick="closeModal()">Cancel</button> <button class="btn red" onclick="deleteCategoryNow(${i})">Delete</button>`)}
function simpleForm(title,fields,cb){modal(title,fields.map(f=>`<label>${f[0]}</label><input id="form_${f[1]}" class="input" value="${esc(f[2])}"><br><br>`).join('')+`<button class="btn out" onclick="closeModal()">Cancel</button> <button class="btn" onclick="submitSimpleForm()">Save</button>`);window._formCb=()=>{let o={};fields.forEach(f=>o[f[1]]=document.getElementById('form_'+f[1]).value.trim());cb(o);closeModal()}}function submitSimpleForm(){if(window._formCb)window._formCb()}
function resolveComplaint(i){state.complaints[i].status=state.complaints[i].status==='Resolved'?'In Progress':'Resolved';save();render()}function addAd(){modal('Add Paid Advertisement',`<label>Business / Seller Name</label><input id="ad_business" class="input"><br><br><label>Advertisement Title</label><input id="ad_title" class="input"><br><br><div class="row"><div><label>Start Date</label><input id="ad_start" class="input" type="date"></div><div><label>End Date</label><input id="ad_end" class="input" type="date"></div></div><br><label>Banner Image</label><input id="ad_file" type="file" accept="image/*"><br><br><button class="btn out" onclick="closeModal()">Cancel</button> <button class="btn gold" onclick="saveAd()">Save Advertisement</button>`)}async function saveAd(){let b=document.getElementById('ad_business').value.trim(),t=document.getElementById('ad_title').value.trim();if(!b||!t)return toast('Business and title are required');let f=document.getElementById('ad_file').files[0];let img='';try{if(f)img=await uploadAdminImage(f,'banners')}catch(e){return toast('Banner image upload failed: '+e.message)}let ad={id:'local-'+Date.now(),business:b,title:t,start:document.getElementById('ad_start').value||'',end:document.getElementById('ad_end').value||'',image:img,active:true,description:''};state.ads.push(ad);if(!(await dbSaveAd(ad))){state.ads.pop();return}save();closeModal();go('ads');toast('Banner saved ✓')}
async function toggleAd(i){state.ads[i].active=!state.ads[i].active;if(!(await dbSaveAd(state.ads[i]))){state.ads[i].active=!state.ads[i].active;return}save();render()}
function addDelivery(){simpleForm('Add Delivery Arrangement',[['Seller / Shop','seller',''],['Delivery Type','type','Seller Self Delivery'],['Internal Note','note','']],o=>{if(!o.seller)return toast('Seller / Shop is required');state.delivery.push({id:Date.now(),seller:o.seller,type:o.type,status:'Active',note:o.note});save();go('delivery')})}function editDelivery(i){let x=state.delivery[i];simpleForm('Edit Delivery Arrangement',[['Seller / Shop','seller',x.seller],['Delivery Type','type',x.type],['Internal Note','note',x.note]],o=>{Object.assign(x,o);save();go('delivery')})}
function readImage(input,target){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{window._pendingImage=e.target.result;document.getElementById(target).innerHTML=`<img class="preview" src="${e.target.result}">`};r.readAsDataURL(f)}async function saveMarket(){Object.assign(state.market,{name:document.getElementById('m_name').value.trim()||'Sukkur Bazar',tagline:document.getElementById('m_tag').value.trim(),supportPhone:document.getElementById('m_phone').value.trim(),supportWhatsapp:document.getElementById('m_wa').value.trim(),address:document.getElementById('m_addr').value.trim()});const f=document.querySelector('#marketPreview')?.previousElementSibling?.files?.[0];if(f){try{state.market.logo=await uploadAdminImage(f,'branding')}catch(e){return toast('Logo upload failed: '+e.message)}}else if(window._pendingImage){state.market.logo=window._pendingImage;window._pendingImage=null}if(!(await dbSaveMarket()))return;save();render();toast('Marketplace profile saved ✓')}function saveAdminProfile(){state.admin.name=document.getElementById('a_name').value.trim()||'Admin';state.admin.phone=document.getElementById('a_phone').value.trim();if(window._pendingImage){state.admin.profile=window._pendingImage;window._pendingImage=null}let a=state.accounts[0];if(a){a.name=state.admin.name;a.phone=state.admin.phone}save();render();toast('Admin profile saved')}
load();try{syncDealsToShopping()}catch(e){}
setTimeout(async()=>{
  document.getElementById('splash').classList.add('hidden');
  const session=await finishOAuthCallback();
  if(session){
    await enterAdminSession(session);
  }else{
    document.getElementById('auth').classList.remove('hidden');
    authMode();
  }
},700);
</script></body></html>
